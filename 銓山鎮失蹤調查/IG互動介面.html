<title>銓山鎮失蹤調查・IG介面模擬</title>
<style>
  :root{
    --ig-bg:#fafafa;
    --ig-surface:#ffffff;
    --ig-text:#262626;
    --ig-text-soft:#8e8e8e;
    --ig-border:#dbdbdb;
    --ig-blue:#0095f6;
    --ig-red:#ed4956;
    --ig-story-1:#f09433;
    --ig-story-2:#e6683c;
    --ig-story-3:#dc2743;
    --ig-story-4:#cc2366;
    --ig-story-5:#bc1888;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ig-bg:#000000;
      --ig-surface:#121212;
      --ig-text:#f5f5f5;
      --ig-text-soft:#a8a8a8;
      --ig-border:#262626;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ig-bg:#000000; --ig-surface:#121212; --ig-text:#f5f5f5; --ig-text-soft:#a8a8a8; --ig-border:#262626;
    color-scheme: dark;
  }
  :root[data-theme="light"]{
    --ig-bg:#fafafa; --ig-surface:#ffffff; --ig-text:#262626; --ig-text-soft:#8e8e8e; --ig-border:#dbdbdb;
    color-scheme: light;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    height:100%;
    overflow:hidden; /* 頁面本身永遠不滾動，只有 .screen 內部滾動 */
  }
  body{
    background:#e8e8e8;
    color:var(--ig-text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",Roboto,Helvetica,Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    height:100dvh;
    padding:20px 0;
  }
  @media (prefers-color-scheme: dark){ body{ background:#000; } }

  .device{
    width:390px;
    max-width:100vw;
    background:var(--ig-bg);
    height:844px;
    max-height:100vh;
    max-height:100dvh;
    position:relative;
    border-radius:36px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    display:flex;
    flex-direction:column;
  }
  @media (max-width:430px){
    .device{ border-radius:0; box-shadow:none; height:100vh; height:100dvh; }
    body{ padding:0; height:100vh; height:100dvh; }
  }

  .statusbar{
    height:20px; flex:none;
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 22px 0; font-size:13px; font-weight:600; color:var(--ig-text);
  }

  .topbar{
    flex:none;
    height:48px;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
    border-bottom:1px solid var(--ig-border);
    background:var(--ig-surface);
  }
  .topbar .logo{
    font-family:Georgia,'Times New Roman',serif;
    font-size:22px;
    font-weight:600;
    letter-spacing:.2px;
  }
  .topbar .icons{ display:flex; gap:16px; align-items:center; }
  .icon-btn{
    background:none; border:none; padding:4px; cursor:pointer;
    color:var(--ig-text); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn svg{ width:24px; height:24px; }

  .screen{ flex:1; overflow-y:auto; display:none; scrollbar-width:none; }
  .screen.active{ display:block; }
  .screen::-webkit-scrollbar{ display:none; }

  /* ---------- stories bar ---------- */
  .stories{
    display:flex; gap:14px; padding:12px 16px; overflow-x:auto;
    border-bottom:1px solid var(--ig-border);
    background:var(--ig-surface);
  }
  .story-item{ flex:none; width:64px; text-align:center; cursor:pointer; background:none; border:none; }
  .story-ring{
    width:60px; height:60px; border-radius:50%;
    background:linear-gradient(45deg,var(--ig-story-1),var(--ig-story-2),var(--ig-story-3),var(--ig-story-4),var(--ig-story-5));
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 4px;
  }
  .story-ring.seen{ background:var(--ig-border); }
  .avatar{
    width:54px; height:54px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#fff; font-size:18px;
    border:2.5px solid var(--ig-surface);
  }
  .story-label{ font-size:11.5px; color:var(--ig-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px; }

  /* ---------- feed ---------- */
  .post{ background:var(--ig-surface); margin-bottom:8px; }
  .post-head{ display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .post-head .avatar{ width:34px; height:34px; font-size:13px; border:none; cursor:pointer; }
  .post-head .who{ flex:1; cursor:pointer; }
  .post-head .name{ font-size:13.5px; font-weight:600; }
  .post-head .time{ font-size:11.5px; color:var(--ig-text-soft); }
  .post-media{
    width:100%; aspect-ratio:1/1;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden; cursor:pointer;
    user-select:none;
  }
  .post-media .icon{ font-size:64px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.15)); }
  .post-media .heart-pop{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; font-size:96px; color:#fff;
    text-shadow:0 2px 12px rgba(0,0,0,.25);
  }
  .post-media .heart-pop.pop{ animation:heartpop .8s ease; }
  @keyframes heartpop{
    0%{ opacity:0; transform:scale(.5); }
    15%{ opacity:1; transform:scale(1.15); }
    30%{ opacity:1; transform:scale(1); }
    75%{ opacity:1; }
    100%{ opacity:0; transform:scale(1); }
  }
  .post-actions{ display:flex; align-items:center; gap:14px; padding:8px 12px 2px; }
  .post-actions .icon-btn{ padding:2px; }
  .post-actions .spacer{ flex:1; }
  .post-likes{ padding:2px 12px 0; font-size:13.5px; font-weight:600; }
  .post-caption{ padding:4px 12px 0; font-size:13.5px; line-height:1.4; }
  .post-caption .name{ font-weight:600; margin-right:5px; }
  .post-comments-preview{ padding:4px 12px 0; }
  .post-comments-preview .viewall{ font-size:13px; color:var(--ig-text-soft); background:none; border:none; padding:0; cursor:pointer; display:block; margin-bottom:2px; }
  .comment-line{ font-size:13.5px; line-height:1.5; }
  .comment-line .name{ font-weight:600; margin-right:5px; }
  .post-addcomment{ display:flex; align-items:center; gap:8px; padding:8px 12px 12px; border-top:1px solid transparent; }
  .post-addcomment input{
    flex:1; border:none; outline:none; background:none; font-size:13.5px; color:var(--ig-text);
    font-family:inherit;
  }
  .post-addcomment input::placeholder{ color:var(--ig-text-soft); }
  .post-addcomment button{ background:none; border:none; color:var(--ig-blue); font-weight:600; font-size:13.5px; cursor:pointer; opacity:.4; }
  .post-addcomment button.enabled{ opacity:1; cursor:pointer; }

  .heart-icon{ color:var(--ig-text); }
  .heart-icon.liked{ color:var(--ig-red); }

  /* ---------- profile ---------- */
  .back-row{ display:flex; align-items:center; gap:10px; padding:10px 12px 0; }
  .back-row .name{ font-weight:600; font-size:15px; }
  .profile-header{ padding:16px; background:var(--ig-surface); }
  .profile-avatar-row{ display:flex; align-items:center; gap:22px; margin-bottom:12px; }
  .profile-header .avatar{ width:82px; height:82px; font-size:28px; border:none; flex:none; }
  .stats{ display:flex; gap:22px; flex:1; }
  .stat{ text-align:center; background:none; border:none; cursor:pointer; color:var(--ig-text); font-family:inherit; padding:0; }
  .stat b{ display:block; font-size:16px; }
  .stat span{ font-size:12.5px; color:var(--ig-text-soft); }
  .profile-name{ font-weight:600; font-size:13.5px; margin-top:2px; }
  .profile-bio{ font-size:13.5px; margin-top:4px; white-space:pre-line; line-height:1.4; color:var(--ig-text); min-height:1px; }
  .profile-tabs{ display:flex; border-top:1px solid var(--ig-border); background:var(--ig-surface); }
  .profile-tab{
    flex:1; text-align:center; padding:10px 0; background:none; border:none; cursor:pointer;
    color:var(--ig-text-soft); border-top:1.5px solid transparent; margin-top:-1px;
  }
  .profile-tab.active{ color:var(--ig-text); border-top-color:var(--ig-text); }
  .profile-tab svg{ width:22px; height:22px; }
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:2px; }
  .grid .cell{ aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; }
  .grid .cell .icon{ font-size:30px; }
  .grid .cell .tagmark{ position:absolute; bottom:5px; right:6px; font-size:11px; opacity:.85; }
  .empty-tab{ text-align:center; color:var(--ig-text-soft); font-size:13px; padding:50px 20px; }

  /* ---------- locked profile ---------- */
  .locked-block{ padding:36px 28px 44px; text-align:center; background:var(--ig-surface); }
  .locked-block .lock-icon{ font-size:38px; margin-bottom:14px; opacity:.55; }
  .locked-title{ font-weight:700; font-size:16px; margin-bottom:6px; }
  .locked-sub{ font-size:13px; color:var(--ig-text-soft); line-height:1.6; margin-bottom:20px; }
  .unlock-row{ display:flex; gap:8px; max-width:280px; margin:0 auto; }
  .unlock-row input{
    flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--ig-border);
    background:var(--ig-bg); color:var(--ig-text); font-size:14px; outline:none; text-align:center;
    letter-spacing:1px;
  }
  .unlock-row input:focus{ border-color:var(--ig-blue); }
  .unlock-row button{
    padding:10px 18px; border-radius:8px; border:none; background:var(--ig-blue); color:#fff;
    font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .unlock-msg{ font-size:12.5px; margin-top:12px; min-height:16px; color:var(--ig-red); }
  .unlock-msg.ok{ color:#3bb54a; }
  .locked-block.shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(6px); }
  }

  /* ---------- following list overlay ---------- */
  .list-overlay{
    position:absolute; inset:0; background:var(--ig-bg); z-index:40;
    display:none; flex-direction:column;
  }
  .list-overlay.active{ display:flex; }
  .list-item{ display:flex; align-items:center; gap:12px; padding:10px 16px; }
  .list-item .avatar{ width:44px; height:44px; font-size:15px; border:none; }
  .list-item .name{ font-size:14px; font-weight:600; }
  .list-item .sub{ font-size:12px; color:var(--ig-text-soft); }
  .list-empty{ text-align:center; color:var(--ig-text-soft); font-size:13px; padding:50px 20px; }

  /* ---------- dm ---------- */
  .dm-list-item{ display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer; }
  .dm-list-item .avatar{ width:52px; height:52px; font-size:18px; border:none; }
  .dm-list-item .meta{ flex:1; min-width:0; }
  .dm-list-item .name{ font-size:14.5px; font-weight:600; }
  .dm-list-item .preview{ font-size:13px; color:var(--ig-text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dm-list-item .badge{ font-size:11px; color:var(--ig-text-soft); }
  .dm-note{ margin:10px 14px; padding:10px 12px; background:var(--ig-border); border-radius:10px; font-size:12px; color:var(--ig-text-soft); line-height:1.5; }

  .thread{ padding:12px 12px 90px; display:flex; flex-direction:column; gap:6px; }
  .bubble-row{ display:flex; }
  .bubble-row.me{ justify-content:flex-end; }
  .bubble{ max-width:72%; padding:9px 13px; border-radius:18px; font-size:14px; line-height:1.4; }
  .bubble-row:not(.me) .bubble{ background:var(--ig-border); color:var(--ig-text); border-bottom-left-radius:5px; }
  .bubble-row.me .bubble{ background:var(--ig-blue); color:#fff; border-bottom-right-radius:5px; }
  .thread-daymark{ text-align:center; font-size:11.5px; color:var(--ig-text-soft); margin:10px 0 4px; }
  .thread-header{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--ig-border); }
  .thread-header .avatar{ width:32px; height:32px; font-size:12px; border:none; }
  .thread-header .name{ font-weight:600; font-size:14.5px; }
  .thread-header .sub{ font-size:11.5px; color:var(--ig-text-soft); }

  /* ---------- threads (獨立小應用，黑白極簡風格區隔於IG) ---------- */
  .threads-switch-btn{ font-weight:700; font-size:17px; font-family:Georgia,serif; }
  .threads-screen{ background:#000; color:#fff; }
  .threads-topbar{
    display:flex; align-items:center; justify-content:space-between;
    height:48px; padding:0 14px; border-bottom:1px solid #262626;
  }
  .threads-icon-btn{ color:#fff; }
  .threads-logo{ font-weight:700; font-size:16px; letter-spacing:.3px; }
  .threads-search-wrap{ padding:10px 14px; }
  .threads-search{
    width:100%; padding:10px 14px; border-radius:20px; border:1px solid #333;
    background:#181818; color:#fff; font-size:14px; outline:none; font-family:inherit;
  }
  .threads-search:focus{ border-color:#666; }
  .threads-empty{ text-align:center; color:#777; font-size:13px; padding:40px 20px; }
  .thread-post{ padding:12px 14px; border-bottom:1px solid #1c1c1c; }
  .thread-post-head{ display:flex; align-items:center; gap:9px; }
  .thread-post-avatar{
    width:34px; height:34px; border-radius:50%; background:#2a2a2a;
    display:flex; align-items:center; justify-content:center; color:#666; font-size:15px; flex:none;
  }
  .thread-post-handle{ font-size:13.5px; font-weight:600; color:#fff; }
  .thread-post-time{ font-size:12px; color:#777; margin-left:auto; }
  .thread-post-text{ font-size:14px; color:#eee; line-height:1.5; margin:6px 0 8px 43px; white-space:pre-line; }
  .thread-post-meta{ display:flex; gap:16px; margin-left:43px; font-size:12.5px; color:#777; }
  .thread-post-comments{ margin:8px 0 0 43px; padding-top:8px; border-top:1px solid #1c1c1c; }
  .thread-comment-line{ font-size:13px; color:#ccc; line-height:1.6; }
  .thread-comment-line b{ color:#fff; font-weight:600; margin-right:5px; }

  /* ---------- 手機主畫面 ---------- */
  .home-screen{ background:linear-gradient(160deg,#2b2b3d,#1a1a24); }
  .home-header{ padding:26px 20px 6px; text-align:center; }
  .home-header .home-time{ font-size:15px; color:#cfcfe0; letter-spacing:.5px; }
  .home-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:20px 14px; padding:14px 18px; }
  .home-app{ display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; cursor:pointer; padding:0; font-family:inherit; }
  .home-app-icon{
    width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:26px; color:#fff; font-weight:700; box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .home-app-icon-ig{ background:linear-gradient(135deg,#f9ce34,#ee2a7b 55%,#6228d7); font-size:24px; }
  .home-app-icon-threads{ background:#000; border:1px solid #3a3a3a; font-family:Georgia,serif; }
  .home-app-icon-fb{ background:#1877f2; font-family:Georgia,serif; font-style:italic; font-size:30px; }
  .home-app span{ font-size:11px; color:#e8e8f0; }

  /* ---------- facebook（獨立小應用，藍色系仿FB風格區隔於IG/Threads） ---------- */
  .fb-screen{ background:#f0f2f5; color:#050505; }
  .fb-topbar{
    display:flex; align-items:center; justify-content:space-between;
    height:48px; padding:0 14px; background:#1877f2; color:#fff; flex:none;
  }
  .fb-icon-btn{ color:#fff; }
  .fb-logo{ font-weight:800; font-size:19px; font-style:italic; font-family:Georgia,serif; letter-spacing:.3px; }
  .fb-post{ background:#fff; margin:8px; border-radius:10px; padding:12px 14px; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .fb-post-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .fb-post-avatar{
    width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:14px; flex:none;
  }
  .fb-post-name{ font-size:14px; font-weight:700; color:#050505; }
  .fb-post-sub{ font-size:11.5px; color:#65676b; }
  .fb-post-text{ font-size:14px; line-height:1.5; color:#050505; margin-bottom:8px; white-space:pre-line; }
  .fb-post-actions{ display:flex; border-top:1px solid #eee; padding-top:4px; gap:4px; }
  .fb-action-btn{ flex:1; text-align:center; padding:6px 0; font-size:12.5px; color:#65676b; font-weight:600; background:none; border:none; cursor:pointer; border-radius:6px; }
  .fb-post-comments{ margin-top:8px; padding-top:8px; border-top:1px solid #eee; }
  .fb-comment-line{ font-size:12.5px; color:#050505; background:#f0f2f5; border-radius:14px; padding:6px 12px; display:block; margin-bottom:4px; width:fit-content; max-width:100%; }
  .fb-comment-line b{ font-weight:700; margin-right:5px; }

  /* ---------- bottom nav ---------- */
  .bottomnav{
    flex:none; display:flex; align-items:center; justify-content:space-around;
    height:52px; border-top:1px solid var(--ig-border); background:var(--ig-surface);
  }
  .navbtn{ background:none; border:none; padding:6px; cursor:pointer; color:var(--ig-text); display:flex; align-items:center; justify-content:center; }
  .navbtn svg{ width:26px; height:26px; }
  .navbtn.active{ color:var(--ig-text); }
  .navbtn:not(.active){ opacity:.55; }

  /* ---------- story viewer ---------- */
  .story-viewer{ position:absolute; inset:0; background:#000; z-index:50; display:none; flex-direction:column; }
  .story-viewer.active{ display:flex; }
  .story-progress{ display:flex; gap:4px; padding:8px 8px 0; }
  .story-progress .bar{ flex:1; height:2.5px; background:rgba(255,255,255,.35); border-radius:2px; overflow:hidden; }
  .story-progress .bar .fill{ height:100%; width:0%; background:#fff; }
  .story-progress .bar.done .fill{ width:100%; }
  .story-vheader{ display:flex; align-items:center; gap:10px; padding:10px 14px; color:#fff; }
  .story-vheader .avatar{ width:32px; height:32px; font-size:12px; border:none; }
  .story-vheader .name{ font-weight:600; font-size:14px; }
  .story-vheader .time{ font-size:12px; opacity:.75; }
  .story-vheader .close{ margin-left:auto; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:4px 8px; }
  .story-body{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  .story-body .icon{ font-size:96px; }
  .story-caption{
    position:absolute; bottom:28px; left:0; right:0; text-align:center;
    color:#fff; font-size:16px; font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,.4); padding:0 20px;
  }
  .story-deleted-badge{
    position:absolute; top:70px; left:0; right:0; text-align:center;
    color:#ddd; font-size:13px; letter-spacing:.5px;
  }
  .story-reply-ghost{
    position:absolute; bottom:70px; left:16px; right:16px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    border-radius:14px; padding:9px 13px; color:#fff; font-size:13px;
  }
  .story-reply-ghost b{ font-weight:600; margin-right:5px; }
  .story-taparea{ position:absolute; top:0; bottom:0; width:34%; }
  .story-taparea.left{ left:0; }
  .story-taparea.right{ right:0; }

  .toast{
    position:absolute; left:50%; bottom:70px; transform:translateX(-50%);
    background:rgba(38,38,38,.92); color:#fff; padding:9px 16px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; }
</style>

<div class="device">
  <div class="statusbar">
    <span id="clock">21:07</span>
    <span>●●●●  🔋</span>
  </div>

  <!-- ============ 手機主畫面 ============ -->
  <div class="screen active home-screen" id="screen-home">
    <div class="home-header"><span class="home-time">我的手機</span></div>
    <div class="home-grid">
      <button class="home-app" onclick="showScreen('feed')">
        <div class="home-app-icon home-app-icon-ig">📷</div>
        <span>Instagram</span>
      </button>
      <button class="home-app" onclick="openThreads()">
        <div class="home-app-icon home-app-icon-threads">@</div>
        <span>Threads</span>
      </button>
      <button class="home-app" onclick="openFacebook()">
        <div class="home-app-icon home-app-icon-fb">f</div>
        <span>Facebook</span>
      </button>
    </div>
  </div>

  <!-- ============ FEED SCREEN ============ -->
  <div class="topbar" id="feedTopbar">
    <button class="icon-btn" onclick="showScreen('home')" title="回到主畫面" aria-label="回到主畫面">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
    </button>

/* ============ 解鎖狀態（存在這台裝置的 localStorage，跟其他玩家的裝置各自獨立） ============ */
const UNLOCK_KEY = 'quanshan_ig_unlocked_accounts';
function getUnlocked(){
  try{ return JSON.parse(localStorage.getItem(UNLOCK_KEY) || '{}'); }catch(e){ return {}; }
}
function setUnlocked(acc){
  const u = getUnlocked(); u[acc] = true;
  localStorage.setItem(UNLOCK_KEY, JSON.stringify(u));
}
function isUnlocked(acc){
  const a = ACCOUNTS[acc];
  if(!a.private) return true;
  return !!getUnlocked()[acc];
}

  return `<div class="avatar" style="background:${a.grad};${size?`width:${size}px;height:${size}px;font-size:${Math.round(size*0.34)}px;`:''}">${a.letter}</div>`;
}

function renderStories(){
  const bar = document.getElementById('storiesBar');
  bar.innerHTML = Object.keys(ACCOUNTS).filter(k=>ACCOUNTS[k].storyFrames && ACCOUNTS[k].storyFrames.length).map(k=>{
    const a = ACCOUNTS[k];
    return `<button class="story-item" onclick="openStory('${k}')">
      <div class="story-ring ${a._storySeen?'seen':''}">${avatarHTML(k,54)}</div>
      <div class="story-label">${a.name}</div>
    </button>`;
  }).join('');
}

function renderFeed(){
  const list = document.getElementById('feedList');
  list.innerHTML = POSTS.map(p=>{
    const a = ACCOUNTS[p.acc];
    const shown = p.comments.slice(-2);
    const hasMore = p.comments.length > 2;
    return `
    <article class="post" id="post-${p.id}">
      <div class="post-head">
        <div onclick="openProfile('${p.acc}')" style="cursor:pointer;">${avatarHTML(p.acc,34)}</div>
        <div class="who" onclick="openProfile('${p.acc}')">
          <div class="name">${a.handle}</div>
        </div>
        <div class="time">${p.time}</div>
      </div>
      <div class="post-media" style="background:${p.grad}" ondblclick="likePost(${p.id}, true)">
        <span class="icon">${p.icon}</span>
        <span class="heart-pop" id="heartpop-${p.id}">❤️</span>
      </div>
      <div class="post-actions">
        <button class="icon-btn heart-icon" id="likebtn-${p.id}" onclick="likePost(${p.id})" aria-label="讚">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.9-10-9.3C.4 8 2 4.5 5.6 4A5.8 5.8 0 0112 7a5.8 5.8 0 016.4-3c3.6.5 5.2 4 3.6 7.7C19.5 16.1 12 21 12 21z"/></svg>
        </button>
        <button class="icon-btn" onclick="focusComment(${p.id})" aria-label="留言">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 01-4 4H8l-5 3V6a4 4 0 014-4h10a4 4 0 014 4z"/></svg>
        </button>
        <button class="icon-btn" onclick="toast('分享功能未開放')" aria-label="分享">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
        <span class="spacer"></span>
        <button class="icon-btn" onclick="toast('收藏功能未開放')" aria-label="收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        </button>
      </div>
      <div class="post-likes" id="likecount-${p.id}">${p.likes} 個讚</div>
      <div class="post-caption"><span class="name">${a.handle}</span>${p.caption}</div>
      <div class="post-comments-preview" id="comments-${p.id}">
        ${hasMore ? `<button class="viewall" onclick="toast('顯示全部 ${p.comments.length} 則留言（示範版略）')">查看全部 ${p.comments.length} 則留言</button>` : ''}
        ${shown.map(c=>`<div class="comment-line"><span class="name">${c.u}</span>${c.t}</div>`).join('')}
      </div>
      <div class="post-addcomment">
        <input type="text" placeholder="留言..." id="input-${p.id}" onkeydown="if(event.key==='Enter')submitComment(${p.id})" oninput="toggleSend(${p.id})">
        <button id="send-${p.id}" onclick="submitComment(${p.id})">發佈</button>
      </div>
    </article>`;
  }).join('');
}

function toggleSend(id){
  const input = document.getElementById('input-'+id);
  const btn = document.getElementById('send-'+id);
  btn.classList.toggle('enabled', input.value.trim().length>0);
}

function submitComment(id){
  const input = document.getElementById('input-'+id);
  const val = input.value.trim();
  if(!val) return;
  const post = POSTS.find(p=>p.id===id);
  post.comments.push({u:'you', t:val});
  input.value='';
  document.getElementById('send-'+id).classList.remove('enabled');
  renderFeed();
}

const likedState = {};
function likePost(id, fromDblTap){
  const already = likedState[id];
  if(fromDblTap && already) return;
  if(!fromDblTap) likedState[id] = !already;
  else likedState[id] = true;

  const post = POSTS.find(p=>p.id===id);
  document.getElementById('likecount-'+id).textContent = (post.likes + (likedState[id]?1:0)) + ' 個讚';
  const btn = document.getElementById('likebtn-'+id);
  btn.querySelector('svg').setAttribute('fill', likedState[id] ? 'currentColor' : 'none');
  btn.classList.toggle('liked', likedState[id]);

  if(fromDblTap){
    const pop = document.getElementById('heartpop-'+id);
    pop.classList.remove('pop'); void pop.offsetWidth; pop.classList.add('pop');
  }
}

function focusComment(id){
  const el = document.getElementById('input-'+id);
  el.focus();
  el.scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- 畫面切換 ---------- */
const IG_SCREENS = ['feed','profile','dmlist','dmthread'];
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.getElementById('feedTopbar').style.display = (name==='feed') ? 'flex' : 'none';
  document.getElementById('navHome').classList.toggle('active', name==='feed');
  document.querySelector('.bottomnav').style.display = IG_SCREENS.includes(name) ? 'flex' : 'none';
}

function openDMList(){
  const wrap = document.getElementById('dmListItems');
  wrap.innerHTML = DM_THREADS.map(th=>{
    return `<div class="dm-list-item" onclick="openThread('${th.id}')">
      ${avatarHTML(th.otherAcc,52)}
      <div class="meta">
        <div class="name">${th.otherLabel}</div>
        <div class="preview">${th.preview}</div>
      </div>
      <div class="badge">${th.time}</div>
    </div>`;
  }).join('');
  showScreen('dmlist');
}

/* ---------- Threads：獨立小應用，用關鍵字搜尋才找得到匿名帳號 ---------- */
function openThreads(){
  showScreen('threads');
  const input = document.getElementById('threadsSearchInput');
  input.value = '';
  renderThreadsResults('');
  setTimeout(()=>input.focus(), 50);
}

function renderThreadsResults(query){
  const q = (query || '').trim();
  const wrap = document.getElementById('threadsResults');
  const matches = q === '' ? [] : THREADS_POSTS.filter(p =>
    p.tags.some(tag => tag.includes(q) || q.includes(tag))
  );

  if(q === ''){
    wrap.innerHTML = `<div class="threads-empty">試試搜尋「銓山鎮」或「戰鼓」看看</div>`;
    return;
  }
  if(matches.length === 0){
    wrap.innerHTML = `<div class="threads-empty">沒有符合「${q}」的貼文</div>`;
    return;
  }

  wrap.innerHTML = matches.map(p => `
    <div class="thread-post">
      <div class="thread-post-head">
        <div class="thread-post-avatar">?</div>
        <span class="thread-post-handle">${p.handle}</span>
        <span class="thread-post-time">${p.time}</span>
      </div>
      <div class="thread-post-text">${p.text}</div>
      <div class="thread-post-meta"><span>❤ ${p.likes}</span><span>💬 ${p.replies}</span></div>
      ${p.comments.length ? `<div class="thread-post-comments">${p.comments.map(c=>`<div class="thread-comment-line"><b>${c.u}</b>${c.t}</div>`).join('')}</div>` : ''}
    </div>`).join('');
}

/* ---------- Facebook：地方社團與鎮公所頁面 ---------- */
function openFacebook(){
  showScreen('fb');
  renderFbFeed();
}

function renderFbFeed(){
  const wrap = document.getElementById('fbFeed');

    return `
    <div class="fb-post">

        <div>
          <div class="fb-post-name">${a.name}</div>
          <div class="fb-post-sub">${a.sub} · ${p.time}</div>
        </div>
      </div>
      <div class="fb-post-text">${p.text}</div>
      <div class="fb-post-actions">
        <button class="fb-action-btn" onclick="toast('示範版尚未開放按讚功能')">👍 讚 ${p.likes}</button>
        <button class="fb-action-btn" onclick="toast('示範版尚未開放留言功能')">💬 留言</button>

function openThread(id){
  const th = DM_THREADS.find(t=>t.id===id);
  document.getElementById('threadAvatar').outerHTML = avatarHTML(th.otherAcc,32).replace('class="avatar"','class="avatar" id="threadAvatar"');
  document.getElementById('threadName').textContent = th.otherLabel;
  document.getElementById('threadSub').textContent = th.sub;
  const body = document.getElementById('threadBody');
  body.innerHTML = th.messages.map(m=>{
    if(m.day) return `<div class="thread-daymark">${m.day}</div>`;
    return `<div class="bubble-row ${m.who==='me'?'me':''}"><div class="bubble">${m.t}</div></div>`;
  }).join('');
  showScreen('dmthread');
  setTimeout(()=>{ body.scrollTop = body.scrollHeight; }, 30);
}

/* ---------- 個人檔案（含私密帳號鎖定與被標記/追蹤中） ---------- */
let currentProfileAcc = null;
let currentProfileTab = 'posts';

function openProfile(acc){
  currentProfileAcc = acc;
  currentProfileTab = 'posts';
  const a = ACCOUNTS[acc];
  document.getElementById('profileHandle').textContent = a.handle;
  document.getElementById('profileAvatar').outerHTML = avatarHTML(acc,82).replace('class="avatar"','class="avatar" id="profileAvatar"');
  const myPosts = POSTS.filter(p=>p.acc===acc);
  document.getElementById('profilePostCount').textContent = myPosts.length;
  document.getElementById('profileFollowers').textContent = a.followers || '0';
  document.getElementById('profileFollowing').textContent = a.following || '0';
  document.getElementById('profileName').textContent = a.name + (a.title?'　'+a.title:'');
  document.getElementById('profileBio').textContent = a.bio || '';
  renderProfileBody();
  showScreen('profile');
}

function renderProfileBody(){
  const acc = currentProfileAcc;
  const a = ACCOUNTS[acc];
  const body = document.getElementById('profileBody');

  if(a.private && !isUnlocked(acc)){
    body.innerHTML = `
      <div class="locked-block" id="lockedBlock">
        <div class="lock-icon">🔒</div>
        <div class="locked-title">此帳號為私人帳號</div>
        <div class="locked-sub">需要驗證存取權限，才能查看貼文與被標記的相片。</div>
        <div class="unlock-row">
          <input type="text" id="unlockInput" placeholder="輸入解鎖碼" onkeydown="if(event.key==='Enter')tryUnlock()">
          <button onclick="tryUnlock()">解鎖</button>
        </div>
        <div class="unlock-msg" id="unlockMsg"></div>
      </div>`;
    return;
  }

  const myPosts = POSTS.filter(p=>p.acc===acc);
  const tagged = a.tagged || [];

  body.innerHTML = `
    <div class="profile-tabs">
      <button class="profile-tab ${currentProfileTab==='posts'?'active':''}" onclick="switchProfileTab('posts')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      </button>
      <button class="profile-tab ${currentProfileTab==='tagged'?'active':''}" onclick="switchProfileTab('tagged')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3l4 4-11 11H6v-4z"/><path d="M3 21h18"/></svg>
      </button>
    </div>
    <div id="profileGrid"></div>
  `;

  const grid = document.getElementById('profileGrid');
  if(currentProfileTab==='posts'){
    if(myPosts.length===0){
      grid.innerHTML = `<div class="empty-tab">這個帳號還沒有貼文</div>`;
    }else{
      grid.className = 'grid';
      grid.innerHTML = myPosts.map(p=>`
        <div class="cell" style="background:${p.grad}" onclick="showScreen('feed'); setTimeout(()=>document.getElementById('post-${p.id}').scrollIntoView({behavior:'smooth',block:'center'}),80)">
          <span class="icon">${p.icon}</span>
        </div>`).join('');
    }
  }else{
    if(tagged.length===0){
      grid.innerHTML = `<div class="empty-tab">尚無被標記的相片</div>`;
    }else{
      grid.className = 'grid';
      grid.innerHTML = tagged.map(t=>`
        <div class="cell" style="background:${t.grad}" onclick="toast('由 @${t.byHandle} 張貼')">
          <span class="icon">${t.icon}</span>
          <span class="tagmark">🏷️</span>
        </div>`).join('');
    }
  }
}

function switchProfileTab(tab){
  currentProfileTab = tab;
  renderProfileBody();
}

function tryUnlock(){
  const acc = currentProfileAcc;
  const a = ACCOUNTS[acc];
  const input = document.getElementById('unlockInput');
  const msg = document.getElementById('unlockMsg');
  const val = (input.value || '').trim();
  if(val === a.unlockCode){
    setUnlocked(acc);
    msg.textContent = '解鎖成功';
    msg.classList.add('ok');
    setTimeout(()=>renderProfileBody(), 400);
  }else{
    msg.textContent = '解鎖碼錯誤，請再試一次';
    msg.classList.remove('ok');
    const block = document.getElementById('lockedBlock');
    block.classList.remove('shake'); void block.offsetWidth; block.classList.add('shake');
    input.value=''; input.focus();
  }
}

function openFollowingList(){
  const acc = currentProfileAcc;
  const a = ACCOUNTS[acc];
  if(a.private && !isUnlocked(acc)){ toast('請先解鎖此帳號'); return; }
  const wrap = document.getElementById('followingItems');
  const list = a.followingList || [];
  if(list.length===0){
    wrap.innerHTML = `<div class="list-empty">（示範版未列出此帳號的追蹤清單）</div>`;
  }else{
    wrap.innerHTML = list.map(f=>`
      <div class="list-item">
        <div class="avatar" style="background:linear-gradient(135deg,#999,#666);">${f.label.slice(0,1)}</div>
        <div>
          <div class="name">${f.handle}</div>
          <div class="sub">${f.label}</div>
        </div>
      </div>`).join('');
  }
  document.getElementById('followingOverlay').classList.add('active');
}
function closeFollowingList(){
  document.getElementById('followingOverlay').classList.remove('active');
}

/* ---------- 限時動態 viewer（支援每個帳號多張frame，含「已刪除」frame） ---------- */
let storyQueue = [];
let storyAccIdx = 0;
let storyFrameIdx = 0;
let storyTimer = null;

function openStory(acc){
  storyQueue = Object.keys(ACCOUNTS).filter(k=>ACCOUNTS[k].storyFrames && ACCOUNTS[k].storyFrames.length);
  storyAccIdx = storyQueue.indexOf(acc);
  storyFrameIdx = 0;
  document.getElementById('storyViewer').classList.add('active');
  showStoryFrame();
}
function renderStoryProgress(){
  const frames = ACCOUNTS[storyQueue[storyAccIdx]].storyFrames;
  const wrap = document.getElementById('storyProgress');
  wrap.innerHTML = frames.map((_,i)=>`<div class="bar ${i<storyFrameIdx?'done':''}" id="sbar-${i}"><div class="fill"></div></div>`).join('');
}
function showStoryFrame(){
  clearTimeout(storyTimer);
  const acc = storyQueue[storyAccIdx];
  const a = ACCOUNTS[acc];
  const frame = a.storyFrames[storyFrameIdx];

  document.getElementById('storyAvatar').outerHTML = avatarHTML(acc,32).replace('class="avatar"','class="avatar" id="storyAvatar"');
  document.getElementById('storyName').textContent = a.handle;
  document.getElementById('storyTime').textContent = frame.time || '';
  document.querySelector('.story-body').style.background = frame.grad;

  const iconEl = document.getElementById('storyIcon');
  const capEl = document.getElementById('storyCaption');
  const delBadge = document.getElementById('storyDeletedBadge');
  const replyGhost = document.getElementById('storyReplyGhost');

  if(frame.deleted){
    iconEl.textContent = '';
    capEl.textContent = '';
    delBadge.style.display = 'block';
    replyGhost.style.display = 'block';
    replyGhost.innerHTML = `<b>${frame.replyUser}</b>${frame.replyText}`;
  }else{
    iconEl.textContent = frame.icon || '';
    capEl.textContent = frame.caption || '';
    delBadge.style.display = 'none';
    replyGhost.style.display = 'none';
  }

  a._storySeen = true;
  renderStoryProgress();
  const fill = document.getElementById('sbar-'+storyFrameIdx).querySelector('.fill');
  fill.style.transition='none'; fill.style.width='0%';
  requestAnimationFrame(()=>{
    fill.style.transition='width 4.8s linear';
    fill.style.width='100%';
  });
  storyTimer = setTimeout(storyNext, 4900);
}
function storyNext(){
  const frames = ACCOUNTS[storyQueue[storyAccIdx]].storyFrames;
  if(storyFrameIdx < frames.length-1){
    storyFrameIdx++; showStoryFrame();
  }else if(storyAccIdx < storyQueue.length-1){
    storyAccIdx++; storyFrameIdx=0; showStoryFrame();
  }else{
    closeStory();
  }
}
function storyPrev(){
  if(storyFrameIdx > 0){ storyFrameIdx--; showStoryFrame(); }
  else if(storyAccIdx > 0){
    storyAccIdx--;
    storyFrameIdx = ACCOUNTS[storyQueue[storyAccIdx]].storyFrames.length - 1;
    showStoryFrame();
  }
}
function closeStory(){
  clearTimeout(storyTimer);
  document.getElementById('storyViewer').classList.remove('active');
  renderStories();
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- clock ---------- */
function tickClock(){
  const el = document.getElementById('clock');
  const d = new Date();
  el.textContent = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
tickClock(); setInterval(tickClock, 15000);

/* ---------- init ---------- */
renderStories();
renderFeed();
showScreen('home');
</script>
